# 推送到 main 時自動建置並發布到 GitHub Pages。
# 第一次使用前：repo 的 Settings → Pages → Build and deployment → Source 選「GitHub Actions」。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 免費方案的私人 repo 不能用 GitHub Pages：repo 為私人時略過（skipped），改為公開後才會執行
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 版本取自 package.json 的 packageManager（pnpm@10.18.0）
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 型別檢查＋正式建置＋檔案大小檢查，輸出到 dist/（使用相對路徑，可放在 /<repo>/ 子路徑）
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
